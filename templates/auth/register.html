{% extends "base_auth.html" %}
{% block title %}Daftar{% endblock %}

{% block content %}
<div class="auth-card" style="max-width:480px;width:100%">
  <div class="auth-logo">
    <div class="auth-logo-ko">드라마 추천 시스템</div>
    <div class="auth-logo-name">KDrama Recommend</div>
  </div>

  <div class="auth-title">Buat Akun Baru</div>
  <div class="auth-sub">Daftar untuk rekomendasi personal dan watchlist drama</div>

  <form method="post" action="{{ url_for('register') }}">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Username <span style="color:var(--blush)">*</span></label>
        <input type="text" name="username" class="form-control"
               placeholder="min. 3 karakter" required minlength="3" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Nama Tampil</label>
        <input type="text" name="display_name" class="form-control"
               placeholder="Nama publik Anda">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Email <span style="color:var(--blush)">*</span></label>
      <input type="email" name="email" class="form-control"
             placeholder="email@contoh.com" required autocomplete="email">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Password <span style="color:var(--blush)">*</span></label>
        <input type="password" name="password" class="form-control"
               placeholder="min. 6 karakter" required minlength="6"
               autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">Konfirmasi <span style="color:var(--blush)">*</span></label>
        <input type="password" name="confirm" class="form-control"
               placeholder="ulangi password" required
               autocomplete="new-password">
      </div>
    </div>

    <button type="submit" class="btn btn-primary" style="margin-top:4px">
      Daftar Sekarang
    </button>
  </form>

  <div class="auth-divider">sudah punya akun?</div>

  <div style="text-align:center;font-size:13px;color:var(--muted)">
    <a href="{{ url_for('login') }}" style="font-weight:600">Masuk di sini</a>
  </div>

  <a href="{{ url_for('index') }}" class="back-link">← Kembali ke Beranda</a>
</div>
{% endblock %}
