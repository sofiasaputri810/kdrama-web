{% extends "base_auth.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-ko">드라마 추천 시스템</div>
    <div class="auth-logo-name">KDrama Recommend</div>
  </div>

  <div class="auth-title">Masuk ke Akun</div>
  <div class="auth-sub">Masuk untuk mendapatkan rekomendasi personal</div>

  <form method="post" action="{{ url_for('login') }}">
    <div class="form-group">
      <label class="form-label">Username atau Email</label>
      <input type="text" name="username" class="form-control"
             placeholder="Masukkan username atau email..." required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control"
             placeholder="Masukkan password..." required>
    </div>
    <button type="submit" class="btn btn-primary" style="margin-top:4px">
      Masuk
    </button>
  </form>

  <div class="auth-divider">atau</div>

  <div style="text-align:center;font-size:13px;color:var(--muted)">
    Belum punya akun?
    <a href="{{ url_for('register') }}" style="font-weight:600">Daftar sekarang</a>
  </div>

  <a href="{{ url_for('index') }}" class="back-link">← Kembali ke Beranda</a>
</div>
{% endblock %}
